name: apo-single-stream-openr1
#name: apo-single-stream-math

image: mosaicml/dle:nightly-latest
scheduling:
  priority: high
  max_retries: 0
  preemptible: true
  retry_on_system_failure: false

compute:
  gpus:  16 #32 #16
  cluster: r5z2p1

#run_name: offline_apo_math_qwen
run_name: offline_apo_openr1_traj_wise_stream_deepseek

parameters:
  seed: 7338
  model:
    name: hf_offline_lm
    beta1: 1
    beta2: 0.01
    eta: 0.5
    loss_type: apo
    pretrained: true
    init_device: mixed
    use_auth_token: true
    use_flash_attention_2: true
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B #deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
    #Qwen/Qwen3-4B-Instruct-2507
    #/tmp/local_qwen 
    #Qwen/Qwen3-4B
    #Qwen/Qwen2.5-Coder-32B-Instruct
    #deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    #Qwen/Qwen2.5-7B

  loggers:
    mlflow:
      tracking_uri: databricks
      experiment_name: offline_apo_openr1_single_resposne
      #/Users/j.chang@databricks.com/mlflow_experiments/offline_apo_single_response_openr1

  callbacks:
    offline_rl: {}
    lr_monitor: {}
    scheduled_gc:
      batch_interval: 2000
    speed_monitor:
      window_size: 10
    memory_monitor: {}
    hf_checkpointer:
      overwrite: true
      precision: bfloat16
      save_folder: s3://data-force-one-datasets/mosaicml-internal-checkpoints/wensun/models/{run_name}
      #s3://data-force-one-datasets/mosaicml-internal-checkpoints/jchang/models/hf/{run_name}
      save_interval: 1ep

  optimizer:
    lr: 1.0e-06 #7.0e-07
    eps: 1.0e-10
    name: decoupled_adamw
    betas:
    - 0.9
    - 0.95
    weight_decay: 1.0e-8
  precision: amp_bf16
  scheduler:
    name: cosine_with_warmup
    alpha_f: 0.05
    t_warmup: 0.02dur
    #name: constant_with_warmup
    #t_warmup: 0.01dur

  tokenizer:
    name: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B #deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
    #Qwen/Qwen3-4B-Instruct-2507
    #Qwen/Qwen2.5-7B
    #deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    kwargs:
      trust_remote_code: true
      padding_side: right

  algorithms:
    gradient_clipping:
      clipping_type: norm
      clipping_threshold: 1
  eval_first: false

  fsdp_config:
    verbose: false
    cpu_offload: false
    mixed_precision: PURE
    state_dict_type: sharded
    forward_prefetch: true
    backward_prefetch: BACKWARD_PRE
    limit_all_gathers: true
    sharding_strategy: FULL_SHARD
    activation_cpu_offload: false
    activation_checkpointing: true
    activation_checkpointing_reentrant: false

  max_seq_len: 16384 #65536 #35000 #16384 #65K does not work due to oom.
  dist_timeout: 3600
  max_duration: 1ep
  autoresume: true
  progress_bar: false
  train_loader:
    name: unified_rl
    dataset:
      local: /tmp/dataset/
      split: train
      remote: dbfs:/Volumes/datasets/wensun/data/offline_apo/traj_wise_openr1/DeepSeek-R1-Distill-Qwen-7B/v3_medium_0.5/
      #dbfs:/Volumes/datasets/wensun/data/offline_apo/step_wise_openr1/DeepSeek-R1-Distill-Qwen-7B/v1_0.5/
      # dbfs:/Volumes/datasets/wensun/data/offline_apo/traj_wise_openr1/DeepSeek-R1-Distill-Qwen-7B/v3_medium_0.5/
      #dbfs:/Volumes/datasets/jchang/data/offline_apo/apo_openr1/DeepSeek-R1-Distill-Qwen-7B/v1_0.5/
      shuffle: true
      max_seq_len: ${max_seq_len}
      flatten_messages: true  # Enable trajectory-wise flattened processing for messages
      tools_path: ../../../compose-rl/example_tools.jsonl
      shuffle_seed: 7338
      download_retry: 4
      download_timeout: 600
    drop_last: false
    num_workers: 8
  save_folder: s3://data-force-one-datasets/mosaicml-internal-checkpoints/wensun/models/mpt/{run_name}
  #s3://data-force-one-datasets/mosaicml-internal-checkpoints/wensun/models/{run_name}
  save_overwrite: True
  eval_interval: 1ep
  save_interval: 1ep
  log_to_console: true
  python_log_level: debug
  load_weights_only: true
  console_log_interval: 5ba
  device_eval_batch_size: 1
  eval_subset_num_batches: -1
  global_train_batch_size: 256
  device_train_microbatch_size: 1


  variables:
    reference_model:
      name: hf_offline_lm
      pretrained: true
      init_device: mixed
      use_auth_token: true
      use_flash_attention_2: true
      pretrained_model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B

integrations:
- integration_type: git_repo
  path: custom-llm-foundry
  git_repo: mosaicml/llm-foundry
  git_branch: main
  pip_install: . --no-deps
- integration_type: git_repo
  path: compose-rl
  git_repo: databricks/Compose-RL
  git_branch: wensun/offline_apo
  pip_install: .[gpu] --no-deps
env_variables:
  AWS_PROFILE: data-force-one
command: |-
  # Run llm foundry train

  #mkdir -p /tmp/local_qwen
  #s5cmd --numworkers 32  cp s3://data-force-one-datasets/mosaicml-internal-checkpoints/wensun/models/offline_apo_tool_call-1-1.0-0.01-1e-06-4-256-4b_f_t/huggingface/ba689/* /tmp/local_qwen

  cd custom-llm-foundry/scripts/train/
  composer train.py /mnt/config/parameters.yaml
